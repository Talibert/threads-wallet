# ==============================================================================
# Propriedades de Testes de Repositório (Apenas Banco de Dados H2 + Flyway)
# ==============================================================================
spring.application.name=threads-wallet-repository-test

# Database H2 In-Memory exclusivo para testes de repository
spring.datasource.url=jdbc:h2:mem:repositorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Migrations para Repository
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
