spring.application.name=threads-wallet-test

# Database H2 In-Memory exclusivo para execução de testes
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Migrations nos Testes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Virtual Threads
spring.threads.virtual.enabled=true

# Configurações do Simulador nos Testes
simulador.monte-carlo.iteracoes=100000
simulador.carga.total-carteiras=1000
simulador.carga.ativos-min-por-carteira=3
simulador.carga.ativos-max-por-carteira=5
